<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Galeri momen Nexus Guild: juara Nexus Cup, gathering, LAN party, siaran langsung final, dan kopdar anggota.">
  <title>Galeri | Nexus Guild</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="script.js" defer></script>
</head>
<body>
  <a class="sendi_skip" href="#sendi_main">Lewati ke konten utama</a>
  <header id="sendi_header"></header>

  <main id="sendi_main">
    <section class="sendi_section">
      <h1>Galeri momen</h1>
      <p style="margin-bottom:22px">Klik foto untuk memperbesar.</p>

      <div class="sendi_grid">
        <button class="sendi_tile" type="button">🏆<small>Juara Nexus Cup S2</small></button>
        <button class="sendi_tile" type="button">🎉<small>Gathering akhir tahun</small></button>
        <button class="sendi_tile" type="button">🖥️<small>Setup LAN party</small></button>
        <button class="sendi_tile" type="button">🎙️<small>Siaran langsung final</small></button>
        <button class="sendi_tile" type="button">🤝<small>Kopdar anggota baru</small></button>
        <button class="sendi_tile" type="button">🏎️<small>Balapan Forza malam</small></button>
      </div>
    </section>

    <div id="sendi_lightbox" role="dialog" aria-modal="true" aria-label="Pratinjau foto" aria-hidden="true" tabindex="-1"></div>
  </main>

  <footer id="sendi_footer"></footer>
</body>
</html>
